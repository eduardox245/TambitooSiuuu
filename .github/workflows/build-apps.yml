
name: Compilar TAMBITOO para iOS y Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Crear aplicaciones
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar iOS y Android
        run: npx eas-cli@latest build --platform all --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
